version: "3.9"

# GroundedAI — local multi-service development stack
#
# Usage:
#   docker compose up --build          # start all services
#   docker compose up truthguard       # start only TruthGuard-AI
#   docker compose down                # stop all services
#
# Ports:
#   TruthGuard-AI:  http://localhost:8000  (verify, batch, feedback)
#   Prompt-Shield:  http://localhost:8001  (shield endpoint)
#   Auto-Grounder:  http://localhost:8002  (ground endpoint)
#
# Environment variables (override in .env or docker-compose.override.yml):
#   TRUTHGUARD_API_KEY   — enable auth on TruthGuard-AI (empty = dev mode)
#   SHIELD_API_KEY       — enable auth on Prompt-Shield
#   GROUNDER_API_KEY     — enable auth on Auto-Grounder
#   OPENAI_API_KEY       — for real LLM backends (optional)
#   TAVILY_API_KEY       — for real search backends (optional)

services:

  truthguard:
    build:
      context: ./truthguard-ai
      dockerfile: Dockerfile
    container_name: grounded-ai-truthguard
    ports:
      - "8000:8000"
    environment:
      - TRUTHGUARD_API_KEY=${TRUTHGUARD_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-mock}
    volumes:
      - truthguard-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prompt-shield:
    build:
      context: ./prompt-shield
      dockerfile: Dockerfile
    container_name: grounded-ai-shield
    ports:
      - "8001:8001"
    environment:
      - SHIELD_API_KEY=${SHIELD_API_KEY:-}
      - SHIELD_LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  auto-grounder:
    build:
      context: ./auto-grounder
      dockerfile: Dockerfile
    container_name: grounded-ai-grounder
    ports:
      - "8002:8002"
    environment:
      - GROUNDER_API_KEY=${GROUNDER_API_KEY:-}
      - GROUNDER_TRUTHGUARD_URL=http://truthguard:8000
      - GROUNDER_LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      truthguard:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  truthguard-data:
    driver: local
