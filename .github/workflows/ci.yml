name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ── TruthGuard-AI ──────────────────────────────────────────────────────────
  truthguard-tests:
    name: TruthGuard-AI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truthguard-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truthguard-ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/ tests/ --select E,W,F,I --ignore E501 || true

  # ── Prompt Shield ──────────────────────────────────────────────────────────
  prompt-shield-tests:
    name: Prompt Shield Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompt-shield

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: prompt-shield/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Auto-Grounder ──────────────────────────────────────────────────────────
  auto-grounder-tests:
    name: Auto-Grounder Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-grounder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: auto-grounder/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── TruthBench ─────────────────────────────────────────────────────────────
  truthbench-tests:
    name: TruthBench Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truthbench

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truthbench/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Integration summary ────────────────────────────────────────────────────
  all-tests-pass:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs:
      - truthguard-tests
      - prompt-shield-tests
      - auto-grounder-tests
      - truthbench-tests
    steps:
      - run: echo "All CI jobs passed."
